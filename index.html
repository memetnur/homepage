<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Links and projects for Nur Memeti." />
    <title>Nur Memeti</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell" aria-label="Nur Memeti homepage">
      <section class="profile">
        <div class="language-switch" aria-label="Language">
          <button class="is-active" type="button" data-lang="en">EN</button>
          <button type="button" data-lang="de">DE</button>
        </div>

        <img
          class="avatar"
          src="assets/profile.png"
          alt="Portrait of Nur Memeti"
        />
        <h1>Nur Memeti</h1>
        <p class="statement" data-i18n="statement">
          AI becomes beautiful when it serves what is deeply human.
        </p>
        <p class="role" data-i18n="role">
          AI Consultant | 30 of 30 Female Founders | Tech Mentor for the Next
          Generation of AI Leaders and Founder in Switzerland
        </p>

        <section class="story-gallery" aria-label="Highlights">
          <div class="gallery-track">
            <figure class="gallery-slide is-active">
              <img src="assets/buildspace-san-francisco.png" alt="Nur Memeti with the Buildspace community in San Francisco" />
              <figcaption><a href="https://buildspace.so">Buildspace · San Francisco, USA</a></figcaption>
            </figure>
            <figure class="gallery-slide">
              <img src="assets/presenting-event.jpg" alt="Nur Memeti presenting on stage" />
              <figcaption>Speaking and sharing ideas</figcaption>
            </figure>
            <figure class="gallery-slide">
              <img src="assets/women-in-tech.png" alt="Women in Tech feature with Nur Memeti" />
              <figcaption>Siemens & Ladies Drive Workshop · Impact Hub Zurich</figcaption>
            </figure>
          </div>
          <div class="gallery-controls" aria-label="Choose highlight">
            <button class="gallery-dot is-active" type="button" aria-label="Show highlight 1"></button>
            <button class="gallery-dot" type="button" aria-label="Show highlight 2"></button>
            <button class="gallery-dot" type="button" aria-label="Show highlight 3"></button>
          </div>
        </section>

        <nav class="links" aria-label="Featured links">
          <a href="https://ki.nurmemeti.com" data-icon="AI">
            <span data-i18n="aiBusiness">AI for Business</span>
          </a>
          <a href="https://workshop.nurmemeti.com" data-icon="WS">
            <span data-i18n="workshop">Workshop</span>
          </a>
          <a href="https://www.linkedin.com/in/nurmemeti" data-icon="IN">
            <span data-i18n="linkedin">LinkedIn</span>
          </a>
          <a href="cv.html" data-icon="CV">
            <span data-i18n="cv">CV</span>
          </a>
        </nav>

        <div class="socials" aria-label="Social links">
          <a href="https://www.linkedin.com/in/nurmemeti" aria-label="LinkedIn">LinkedIn</a>
          <a href="https://github.com/memetnur" aria-label="GitHub">GitHub</a>
        </div>
      </section>
    </main>

    <script>
      const translations = {
        en: {
          statement:
            "AI becomes beautiful when it serves what is deeply human.",
          role:
            "AI Consultant | 30 of 30 Female Founders | Tech Mentor for the Next Generation of AI Leaders and Founder in Switzerland",
          aiBusiness: "AI for Business",
          workshop: "Workshop",
          linkedin: "LinkedIn",
          cv: "CV",
        },
        de: {
          statement:
            "KI wird schoen, wenn sie dem zutiefst Menschlichen dient.",
          role:
            "KI-Beraterin | 30 von 30 Female Founders | Tech-Mentorin fuer die naechste Generation von KI-Leaderinnen und Gruenderinnen in der Schweiz",
          aiBusiness: "KI fuer Unternehmen",
          workshop: "Workshop",
          linkedin: "LinkedIn",
          cv: "CV",
        },
      };

      const languageButtons = document.querySelectorAll("[data-lang]");
      const translatableItems = document.querySelectorAll("[data-i18n]");

      function setLanguage(language) {
        document.documentElement.lang = language;
        translatableItems.forEach((item) => {
          item.textContent = translations[language][item.dataset.i18n];
        });
        languageButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.lang === language);
        });
      }

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      const gallerySlides = document.querySelectorAll(".gallery-slide");
      const galleryDots = document.querySelectorAll(".gallery-dot");
      let galleryIndex = 0;

      function showGallerySlide(index) {
        galleryIndex = index;
        gallerySlides.forEach((slide, slideIndex) => {
          slide.classList.toggle("is-active", slideIndex === galleryIndex);
        });
        galleryDots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === galleryIndex);
        });
      }

      galleryDots.forEach((dot, index) => {
        dot.addEventListener("click", () => showGallerySlide(index));
      });

      setInterval(() => {
        showGallerySlide((galleryIndex + 1) % gallerySlides.length);
      }, 5000);
    </script>
  </body>
</html>
